<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111c">
  <meta name="description" content="ARIDES Transport — kaubavedu, kolimised ja ehitusmaterjalide transport üle Eesti. Telefon +372 5853 6770.">
  <title>ARIDES Transport | Kaubavedu Eestis</title>
  <link rel="canonical" href="https://arides.ee/">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#07111c}
    body{font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
    .page{width:100%;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;background:#07111c}
    .poster{position:relative;width:min(100vw,1448px);aspect-ratio:4/3;background:#07111c;overflow:hidden}
    .poster img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
    .hotspot{position:absolute;z-index:4;display:block;background:transparent;border:0;text-indent:-9999px;overflow:hidden;cursor:pointer;border-radius:18px}
    .hotspot:focus-visible{outline:3px solid #ff6414;outline-offset:2px}
    .phone{left:61.2%;top:2.0%;width:14.5%;height:5.2%}
    .mail{left:75.8%;top:2.0%;width:12.8%;height:5.2%}
    .cta{left:4.1%;top:42.15%;width:17.7%;height:5.5%}
    .whatsapp{left:22.9%;top:42.15%;width:13.0%;height:5.5%}
    .loading{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;letter-spacing:.14em;font-size:13px;background:#07111c;z-index:5}
    .loading span:after{content:'...';color:#ff6414}
    .ready .loading{display:none}
    @media(max-width:700px){.poster{width:100vw}.hotspot{border-radius:8px}}
  </style>
</head>
<body>
  <main class="page">
    <div class="poster" id="poster" aria-label="ARIDES Transport">
      <div class="loading"><span>ARIDES TRANSPORT</span></div>
      <img id="hero" alt="ARIDES Transport — kaubavedu Eestis" decoding="async">
      <a class="hotspot phone" href="tel:+37258536770" aria-label="Helista +372 5853 6770">Helista</a>
      <a class="hotspot mail" href="mailto:info@arides.ee" aria-label="Kirjuta info@arides.ee">E-post</a>
      <a class="hotspot cta" href="https://wa.me/37258536770" target="_blank" rel="noopener" aria-label="Võta ühendust WhatsAppis">Võta ühendust</a>
      <a class="hotspot whatsapp" href="https://wa.me/37258536770" target="_blank" rel="noopener" aria-label="WhatsApp">WhatsApp</a>
    </div>
  </main>
  <script>
    (()=>{
      const VERSION='828ce4b1';
      const poster=document.getElementById('poster');
      const loading=document.querySelector('.loading');
      const img=document.getElementById('hero');
      const name=n=>String(n).padStart(2,'0');
      const local=n=>`./data/hero_exact_${name(n)}.txt?v=${VERSION}`;
      const raw=n=>`https://raw.githubusercontent.com/aridesteenus-bit/arides-site/main/data/hero_exact_${name(n)}.txt?v=${VERSION}`;

      async function getPart(n){
        for(const url of [local(n),raw(n)]){
          try{
            const r=await fetch(url,{cache:'no-store'});
            if(r.ok){
              const t=(await r.text()).replace(/\s+/g,'');
              if(t.length>100) return t;
            }
          }catch(_){ }
        }
        throw new Error('part '+n);
      }

      async function load(){
        try{
          const parts=await Promise.all(Array.from({length:11},(_,i)=>getPart(i+1)));
          img.onload=()=>poster.classList.add('ready');
          img.onerror=()=>{loading.innerHTML='<span>ARIDES — pildi laadimine ebaõnnestus</span>'};
          img.src='data:image/webp;base64,'+parts.join('');
        }catch(e){
          loading.innerHTML='<span>ARIDES — laadimine ebaõnnestus</span>';
        }
      }
      load();
    })();
  </script>
</body>
</html>
