<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111c">
  <meta name="description" content="ARIDES Transport — kaubavedu, kolimised ja ehitusmaterjalide transport üle Eesti. Telefon +372 5853 6770.">
  <link rel="canonical" href="https://arides.ee/">
  <link rel="icon" href="./favicon.ico">
  <title>ARIDES Transport | Kaubavedu Eestis</title>
  <style>
    :root{--bg:#07111c;--orange:#ff5a0a}
    *{box-sizing:border-box}
    html{background:var(--bg);scroll-behavior:smooth}
    body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
    .page{width:100%;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:var(--bg)}
    .poster{position:relative;width:100%;max-width:1600px;aspect-ratio:1448/1086;background:var(--bg);overflow:hidden;isolation:isolate}
    .poster>img{
      position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;
      user-select:none;-webkit-user-drag:none;
      filter:contrast(1.095) saturate(1.085) brightness(1.018);
      image-rendering:auto;
      transform:translateZ(0);
    }
    .poster:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 20%,transparent 82%,rgba(0,0,0,.02));mix-blend-mode:soft-light}
    .loading{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:#07111c;color:#fff;font-size:13px;font-weight:800;letter-spacing:.18em}
    .loading span:after{content:'...';color:var(--orange)}
    .ready .loading{opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease}

    .hotspot{
      position:absolute;z-index:10;display:block;background:transparent;border:0;color:transparent;
      font-size:0;text-decoration:none;cursor:pointer;border-radius:16px;
      transition:box-shadow .18s ease,background .18s ease,transform .18s ease;
    }
    .hotspot:hover{box-shadow:inset 0 0 0 2px rgba(255,255,255,.22),0 0 22px rgba(255,90,10,.15);background:rgba(255,255,255,.015)}
    .hotspot:active{transform:scale(.995)}
    .hotspot:focus-visible{outline:3px solid #fff;outline-offset:3px}

    .nav-home{left:29.3%;top:3.0%;width:5.0%;height:3.5%}
    .nav-services{left:36.0%;top:3.0%;width:5.3%;height:3.5%}
    .nav-about{left:43.4%;top:3.0%;width:4.0%;height:3.5%}
    .nav-contact{left:49.0%;top:3.0%;width:4.8%;height:3.5%}
    .phone{left:61.4%;top:2.0%;width:13.7%;height:4.5%}
    .mail{left:75.8%;top:2.0%;width:12.5%;height:4.5%}
    .lang{left:91.5%;top:2.4%;width:2.4%;height:3.7%}
    .cta{left:4.2%;top:42.2%;width:17.6%;height:5.4%}
    .whatsapp{left:23.0%;top:42.2%;width:12.8%;height:5.4%}
    .service-freight{left:4.2%;top:53.6%;width:14.4%;height:6.1%}
    .service-move{left:20.0%;top:53.6%;width:15.6%;height:6.1%}
    .service-build{left:37.1%;top:53.6%;width:15.2%;height:6.1%}

    #services,#about,#coverage{position:absolute;left:0;width:1px;height:1px;pointer-events:none}
    #services{top:51%}#about{top:62%}#coverage{top:70%}

    @media(max-width:700px){
      .poster{width:100vw;max-width:none;aspect-ratio:1448/1086}
      .hotspot{border-radius:6px}
    }
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.ready .loading{transition:none}.hotspot{transition:none}}
  </style>
</head>
<body>
  <main class="page">
    <section class="poster" id="top" aria-label="ARIDES Transport — kaubavedu Eestis">
      <div class="loading" aria-live="polite"><span>ARIDES TRANSPORT</span></div>
      <img id="visual" alt="ARIDES Transport — kaubavedu Eestis" decoding="async">

      <a class="hotspot nav-home" href="#top" aria-label="Avaleht">Avaleht</a>
      <a class="hotspot nav-services" href="#services" aria-label="Teenused">Teenused</a>
      <a class="hotspot nav-about" href="#about" aria-label="Meist">Meist</a>
      <a class="hotspot nav-contact" href="mailto:info@arides.ee" aria-label="Kontakt">Kontakt</a>
      <a class="hotspot phone" href="tel:+37258536770" aria-label="Helista +372 5853 6770">Telefon</a>
      <a class="hotspot mail" href="mailto:info@arides.ee" aria-label="Kirjuta info@arides.ee">E-post</a>
      <a class="hotspot lang" href="#top" aria-label="Eesti keel">ET</a>

      <a class="hotspot cta" href="tel:+37258536770" aria-label="Võta ühendust">Võta ühendust</a>
      <a class="hotspot whatsapp" href="https://wa.me/37258536770" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">WhatsApp</a>

      <a class="hotspot service-freight" href="tel:+37258536770" aria-label="Kaubavedu">Kaubavedu</a>
      <a class="hotspot service-move" href="tel:+37258536770" aria-label="Kolimised">Kolimised</a>
      <a class="hotspot service-build" href="tel:+37258536770" aria-label="Ehitusmaterjalide transport">Ehitusmaterjalid</a>

      <span id="services" aria-hidden="true"></span>
      <span id="about" aria-hidden="true"></span>
      <span id="coverage" aria-hidden="true"></span>
    </section>
  </main>

  <script>
    (()=>{
      const VERSION='20260916-premium5';
      const poster=document.getElementById('top');
      const loading=document.querySelector('.loading');
      const img=document.getElementById('visual');
      const name=n=>String(n).padStart(2,'0');
      const local=n=>`./data/premium_${name(n)}.txt?v=${VERSION}`;
      const raw=n=>`https://raw.githubusercontent.com/aridesteenus-bit/arides-site/main/data/premium_${name(n)}.txt?v=${VERSION}`;

      async function getPart(n){
        for(const url of [local(n),raw(n)]){
          try{
            const r=await fetch(url,{cache:'no-store'});
            if(!r.ok) continue;
            const t=(await r.text()).replace(/\s+/g,'');
            if(t.length>100) return t;
          }catch(_){ }
        }
        throw new Error(`part ${n}`);
      }

      async function load(){
        try{
          const parts=await Promise.all(Array.from({length:11},(_,i)=>getPart(i+1)));
          img.onload=()=>poster.classList.add('ready');
          img.onerror=()=>{loading.innerHTML='<span>ARIDES — pildi laadimine ebaõnnestus</span>'};
          img.src='data:image/webp;base64,'+parts.join('');
        }catch(err){
          console.error(err);
          loading.innerHTML='<span>ARIDES — laadimine ebaõnnestus</span>';
        }
      }
      load();
    })();
  </script>
</body>
</html>
